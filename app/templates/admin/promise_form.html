{% extends "admin/base.html" %}
{% block title %}Belofte toevoegen{% endblock %}
{% block header_title %}Belofte toevoegen{% endblock %}
{% block header_actions %}<a href="/admin/beloftes" class="btn btn-ghost">← Terug</a>{% endblock %}

{% block content %}
<div class="admin-card form-card">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/beloftes/nieuw">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Soort belofte *</label>
                <select name="source_kind" class="form-select" id="sourceKind">
                    <option value="regeerakkoord">Regeerakkoord</option>
                    <option value="verkiezingsprogramma">Verkiezingsprogramma</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Verkiezingsjaar <span class="form-hint-inline">(bij verkiezingsprogramma)</span></label>
                <input type="number" name="election_year" class="form-input" placeholder="bijv. 2023" min="1900" max="2100">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Kabinet <span class="form-hint-inline">(bij regeerakkoord)</span></label>
                <select name="cabinet_id" class="form-select">
                    <option value="">— Geen —</option>
                    {% for cab in cabinets %}
                    <option value="{{ cab.id }}">{{ cab.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Partij</label>
                <select name="party_id" class="form-select">
                    <option value="">— Geen (hele coalitie) —</option>
                    {% for party in parties %}
                    <option value="{{ party.id }}">{{ party.abbreviation }} – {{ party.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Titel / belofte *</label>
            <input type="text" name="title" class="form-input" required placeholder="bijv. De AOW-leeftijd wordt niet verhoogd in deze kabinetsperiode">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Categorie</label>
                <input type="text" name="category" class="form-input" list="categoryList" placeholder="bijv. Zorg" value="Overig">
                <datalist id="categoryList">
                    {% for cat in categories %}<option value="{{ cat }}">{% endfor %}
                </datalist>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in statuses %}
                    <option value="{{ s.name }}" {% if s.name == 'beloofd' %}selected{% endif %}>{{ s.value }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Omschrijving</label>
            <textarea name="description" class="form-textarea" rows="4" placeholder="Uitgebreidere uitleg van de belofte en de context"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Originele tekst uit bron</label>
            <textarea name="source_text" class="form-textarea" rows="3" placeholder="Exact citaat uit regeerakkoord of verkiezingsprogramma (optioneel)"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Toevoegen</button>
            <a href="/admin/beloftes" class="btn btn-ghost">Annuleren</a>
        </div>
    </form>
</div>
{% endblock %}
